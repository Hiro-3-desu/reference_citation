name: Deploy add-in to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/checkout@v4
        with:
          repository: citation-style-language/styles
          path: csl-styles
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          CSL_STYLES_DIR: csl-styles
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
